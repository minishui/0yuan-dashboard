<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>进校数据分析门户</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; background: #f1f5f9; color: #0f172a; }
    #app { display: flex; height: 100vh; overflow: hidden; }

    /* ===== 侧边栏 ===== */
    .sidebar {
      width: 240px; flex: 0 0 240px;
      background: #0f172a; color: #e2e8f0;
      display: flex; flex-direction: column;
      padding: 22px 0;
    }
    .brand { padding: 0 22px 18px; border-bottom: 1px solid #1e293b; margin-bottom: 14px; }
    .brand .mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg,#3b82f6,#6366f1); color: #fff;
      font-size: 20px; font-weight: 700; margin-bottom: 10px;
    }
    .brand h1 { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
    .brand p { font-size: 11px; color: #94a3b8; margin-top: 4px; }

    .nav-label { padding: 10px 22px 6px; font-size: 11px; color: #64748b; letter-spacing: 1px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 22px; cursor: pointer; font-size: 14px; font-weight: 600;
      color: #cbd5e1; border-left: 3px solid transparent; transition: all .15s;
    }
    .nav-item .ico { width: 22px; text-align: center; font-size: 16px; }
    .nav-item:hover { background: #1e293b; color: #fff; }
    .nav-item.active { background: #1e293b; color: #fff; border-left-color: #3b82f6; }

    .sidebar-foot { margin-top: auto; padding: 14px 22px 0; font-size: 11px; color: #64748b; border-top: 1px solid #1e293b; }
    .sidebar-foot a { color: #93c5fd; text-decoration: none; }

    /* ===== 主区 ===== */
    .main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: 52px; flex: 0 0 52px; background: #fff; border-bottom: 1px solid #e2e8f0;
      display: flex; align-items: center; padding: 0 20px; gap: 12px;
    }
    .topbar .crumb { font-size: 15px; font-weight: 700; }
    .topbar .desc { font-size: 12px; color: #64748b; }
    .topbar .right { margin-left: auto; font-size: 12px; color: #94a3b8; }

    .frame-wrap { flex: 1 1 auto; position: relative; background: #fff; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }

    /* ===== 移动端 ===== */
    @media (max-width: 720px) {
      .sidebar { width: 64px; flex-basis: 64px; }
      .brand h1, .brand p, .nav-item span.txt, .nav-label, .sidebar-foot { display: none; }
      .nav-item { justify-content: center; padding: 14px 0; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">析</div>
        <h1>进校数据分析门户</h1>
        <p>0元课 · 百川落地页 一体化看板</p>
      </div>
      <div class="nav-label">看板</div>
      <div class="nav-item active" data-target="0yuan" data-title="0元课前总览" data-desc="全渠道 · 8 Tab · 每日10:10更新">
        <span class="ico">📊</span><span class="txt">0元课前总览</span>
      </div>
      <div class="nav-item" data-target="baichuan" data-title="百川落地页分析" data-desc="主链路漏斗 · 阅读/数学">
        <span class="ico">🔻</span><span class="txt">百川落地页分析</span>
      </div>
      <div class="sidebar-foot">
        数据每日自动更新 · 口径见各看板说明
      </div>
    </aside>

    <section class="main">
      <div class="topbar">
        <span class="crumb" id="crumb">0元课前总览</span>
        <span class="desc" id="crumbDesc">全渠道 · 8 Tab · 每日10:10更新</span>
        <span class="right" id="updated">—</span>
      </div>
      <div class="frame-wrap">
        <iframe id="frame" src="0yuan.html" title="0元课前总览"></iframe>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var items = document.querySelectorAll('.nav-item');
      var frame = document.getElementById('frame');
      var crumb = document.getElementById('crumb');
      var crumbDesc = document.getElementById('crumbDesc');

      var PATH_MAP = { '0yuan': '0yuan.html', 'baichuan': 'baichuan/index.html' };
      function switchTo(el) {
        items.forEach(function (i) { i.classList.remove('active'); });
        el.classList.add('active');
        var target = el.getAttribute('data-target');
        frame.src = PATH_MAP[target] || (target + '.html');
        crumb.textContent = el.getAttribute('data-title');
        crumbDesc.textContent = el.getAttribute('data-desc');
        try { localStorage.setItem('portal_last', target); } catch (e) {}
      }

      items.forEach(function (el) {
        el.addEventListener('click', function () { switchTo(el); });
      });

      // 记忆上次选择（同浏览器）
      try {
        var last = localStorage.getItem('portal_last');
        if (last) {
          var matched = document.querySelector('.nav-item[data-target="' + last + '"]');
          if (matched) switchTo(matched);
        }
      } catch (e) {}

      // 顶栏右侧显示百川数据更新时间（若可用）
      fetch('baichuan/js/data.js', { cache: 'no-store' })
        .then(function (r) { return r.text(); })
        .then(function (t) {
          var m = t.match(/"generated_at":"([^"]+)"/);
          if (m) document.getElementById('updated').textContent = '百川数据生成于 ' + m[1];
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
